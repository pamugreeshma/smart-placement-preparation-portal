{% extends "base.html" %}

{% block title %}
Add Task | CareerForge
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="mx-auto" style="max-width: 760px;">

        <a
            href="{{ url_for('tasks.index') }}"
            class="text-decoration-none"
        >
            ← Back to Tasks
        </a>


        <div class="mt-3 mb-4">

            <p class="text-primary fw-semibold mb-1">
                DAILY PREPARATION
            </p>

            <h1 class="fw-bold">
                Create Task
            </h1>

            <p class="text-muted">
                Plan today's preparation and earn XP
                when you complete it.
            </p>

        </div>


        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Task Title *
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            required
                            placeholder="Solve 10 graph problems"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="3"
                            placeholder="Optional notes..."
                        ></textarea>

                    </div>


                    <div class="row g-3">

                        <div class="col-md-4">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                name="category"
                                class="form-select"
                            >

                                {% for category in categories %}

                                    <option value="{{ category }}">
                                        {{ category }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="col-md-4">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                name="priority"
                                class="form-select"
                            >

                                {% for priority in priorities %}

                                    <option
                                        value="{{ priority }}"
                                        {% if priority == "Medium" %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ priority }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="col-md-4">

                            <label class="form-label">
                                Due Date
                            </label>

                            <input
                                type="date"
                                name="due_date"
                                class="form-control"
                            >

                        </div>

                    </div>


                    <div class="d-flex
                                justify-content-end
                                gap-2
                                mt-4">

                        <a
                            href="{{ url_for('tasks.index') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary px-4"
                        >
                            Create Task
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
