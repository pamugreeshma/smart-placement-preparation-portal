<div class="row g-4">

    <!-- TOTAL APPLICATIONS -->

    <div class="col-md-6 col-xl-3">

        <div class="card border-0 shadow-sm h-100">

            <div class="card-body p-4">

                <div class="d-flex
                            justify-content-between
                            align-items-start">

                    <div>

                        <p class="text-muted mb-2">
                            Applications
                        </p>

                        <h2 class="fw-bold mb-0">
                            {{ stats.applications }}
                        </h2>

                    </div>

                    <div class="fs-3">
                        💼
                    </div>

                </div>

                <a
                    href="{{ url_for('applications.index') }}"
                    class="small text-decoration-none"
                >
                    View tracker →
                </a>

            </div>

        </div>

    </div>


    <!-- INTERVIEWS -->

    <div class="col-md-6 col-xl-3">

        <div class="card border-0 shadow-sm h-100">

            <div class="card-body p-4">

                <div class="d-flex
                            justify-content-between
                            align-items-start">

                    <div>

                        <p class="text-muted mb-2">
                            Interviews
                        </p>

                        <h2 class="fw-bold mb-0">
                            {{ stats.interviews }}
                        </h2>

                    </div>

                    <div class="fs-3">
                        🎯
                    </div>

                </div>

                <p class="small text-muted mb-0">
                    Active opportunities
                </p>

            </div>

        </div>

    </div>


    <!-- OFFERS -->

    <div class="col-md-6 col-xl-3">

        <div class="card border-0 shadow-sm h-100">

            <div class="card-body p-4">

                <div class="d-flex
                            justify-content-between
                            align-items-start">

                    <div>

                        <p class="text-muted mb-2">
                            Offers
                        </p>

                        <h2 class="fw-bold mb-0">
                            {{ stats.offers }}
                        </h2>

                    </div>

                    <div class="fs-3">
                        🏆
                    </div>

                </div>

                <p class="small text-muted mb-0">
                    Career milestones
                </p>

            </div>

        </div>

    </div>


    <!-- RESUME STATUS -->

    <div class="col-md-6 col-xl-3">

        <div class="card border-0 shadow-sm h-100">

            <div class="card-body p-4">

                <div class="d-flex
                            justify-content-between
                            align-items-start">

                    <div>

                        <p class="text-muted mb-2">
                            Resume
                        </p>

                        {% if stats.resume_completed %}

                            <h5 class="fw-bold
                                       text-success
                                       mb-0">
                                Ready
                            </h5>

                        {% else %}

                            <h5 class="fw-bold
                                       text-warning
                                       mb-0">
                                Incomplete
                            </h5>

                        {% endif %}

                    </div>

                    <div class="fs-3">
                        📄
                    </div>

                </div>

                <a
                    href="{{ url_for('resume.builder') }}"
                    class="small text-decoration-none"
                >
                    Open builder →
                </a>

            </div>

        </div>

    </div>

</div>
