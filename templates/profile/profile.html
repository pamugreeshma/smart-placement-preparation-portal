{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row">

        <div class="col-lg-4">

            <div class="card shadow-sm border-0 text-center p-4">

                <img
                    src="{{ url_for('static', filename='images/default.png') }}"
                    class="rounded-circle mx-auto"
                    width="150"
                >

                <h3 class="mt-3">
                    {{ current_user.full_name }}
                </h3>

                <p class="text-muted">
                    {{ current_user.email }}
                </p>

            </div>

        </div>

        <div class="col-lg-8">

            <div class="card shadow-sm border-0 p-4">

                <h3 class="mb-4">
                    Edit Profile
                </h3>

                <form method="POST">

                    <div class="mb-3">

                        <label>Full Name</label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            value="{{ current_user.full_name }}"
                        >

                    </div>

                    <div class="mb-3">

                        <label>College</label>

                        <input
                            type="text"
                            name="college"
                            class="form-control"
                            value="{{ current_user.college or '' }}"
                        >

                    </div>

                    <div class="mb-3">

                        <label>Branch</label>

                        <input
                            type="text"
                            name="branch"
                            class="form-control"
                            value="{{ current_user.branch or '' }}"
                        >

                    </div>

                    <div class="mb-3">

                        <label>Graduation Year</label>

                        <input
                            type="number"
                            name="graduation_year"
                            class="form-control"
                            value="{{ current_user.graduation_year or '' }}"
                        >

                    </div>

                    <div class="mb-3">

                        <label>Skills</label>

                        <textarea
                            class="form-control"
                            rows="4"
                            name="skills"
                        >{{ current_user.skills or '' }}</textarea>

                    </div>

                    <div class="mb-3">

                        <label>Dream Company</label>

                        <input
                            type="text"
                            name="dream_company"
                            class="form-control"
                            value="{{ current_user.dream_company or '' }}"
                        >

                    </div>

                    <div class="mb-3">

                        <label>Bio</label>

                        <textarea
                            class="form-control"
                            rows="5"
                            name="bio"
                        >{{ current_user.bio or '' }}</textarea>

                    </div>

                    <button class="btn btn-primary">

                        Save Profile

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
